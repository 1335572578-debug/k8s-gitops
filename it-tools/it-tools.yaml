apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-tools
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: it-tools
  template:
    metadata:
      labels:
        app: it-tools
    spec:
      containers:
      - name: it-tools
        image: docker.m.daocloud.io/corentinth/it-tools:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: it-tools-service
  namespace: default
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30088
  selector:
    app: it-tools
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: it-tools-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: it-tools.10.80.2.211.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: it-tools-service
            port:
              number: 80
